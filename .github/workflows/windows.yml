name: Windows V1
on:
  push:
    branches: [master, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-and-package:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install frontend dependencies
        run: npm ci
      - name: Frontend type check and build
        run: npm run build
      - name: Rust format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Native release and NSIS installer
        run: npm run tauri build
      - name: Collect installable artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Copy-Item src-tauri/target/release/bundle/nsis/*-setup.exe artifacts/XTools_Setup.exe
          Copy-Item src-tauri/target/release/xtools.exe artifacts/XTools.exe
          Get-FileHash artifacts/*.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  $([IO.Path]::GetFileName($_.Path))" } | Set-Content artifacts/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: XTools-0.1.0-windows-x64
          path: artifacts/
