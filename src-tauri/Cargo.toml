[package]
name = "xtools"
version = "0.2.0"
description = "Local Windows launcher and productivity tools"
edition = "2021"
rust-version = "1.90"

[lib]
name = "xtools_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
pinyin = "0.10"
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "webp"] }
uuid = { version = "1", features = ["v4"] }
arboard = "3.6"
winreg = "0.55"
log = "0.4"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Variant", "Win32_System_Ole", "Win32_UI_Shell_Common", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_System_Memory", "Win32_System_Environment", "Win32_System_Threading"] }
tauri-winrt-notification = "0.8"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
opt-level = "s"
